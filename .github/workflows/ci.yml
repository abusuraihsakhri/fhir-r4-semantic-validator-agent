name: Tests and FHIR validation checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e '.[api,test]'
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q agents fhir_r4_semantic_validator_agent fhir_validation.py cli.py
      - name: Run tests
        run: python -m pytest -q
      - name: Check browser script syntax
        run: |
          python -c "from pathlib import Path; s=Path('web/index.html').read_text(); Path('/tmp/fhir-ui.js').write_text(s.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/fhir-ui.js
