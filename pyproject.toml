[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-r4-semantic-validator-engine"
version = "2.0.0"
description = "FHIR-Validator Pro: Autonomous FHIR R4 Bundle Semantic & Profile Conformance Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
fhir-r4-semantic-validator-engine = "fhir_r4_semantic_validator_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/fhir-r4-semantic-validator-engine"
Repository = "https://github.com/abusuraihsakhri/fhir-r4-semantic-validator-engine.git"
